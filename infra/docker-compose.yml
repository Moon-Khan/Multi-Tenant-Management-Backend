services:
  postgres:
    image: postgres:16
    container_name: multitenant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: multitenant
    ports:
      # Host port 5434 — this dev machine already has other things bound to
      # 5432 (local system PostgreSQL) and 5433 (another local stack).
      - '5434:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: multitenant-redis
    restart: unless-stopped
    ports:
      # Host port 6381 — 6379/6380 are already taken on this dev machine.
      - '6381:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
